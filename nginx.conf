events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # =========================
        # ASSETS
        # =========================
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # =========================
        # CHAT
        # =========================
        location /chat/ {
            try_files $uri =404;
        }

        # =========================
        # SERVICE WORKER / MANIFEST
        # =========================
        location = /sw.js {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location = /manifest.json {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # =========================
        # API - STREAM
        # =========================
        location = /api/stream {
            default_type application/json;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
            try_files /api/stream.json =404;
        }

        # =========================
        # API - 24/7 STREAM
        # Vercel points this route
        # to stream-24-7.js
        # =========================
        location = /api/stream-24-7 {
            default_type application/javascript;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
            try_files /api/stream-24-7.js =404;
        }

        # =========================
        # API - EPG
        # =========================
        location = /api/epg {
            default_type application/javascript;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
            try_files /api/epg.js =404;
        }

        # =========================
        # API - TOKEN
        # =========================
        location = /api/token {
            default_type application/javascript;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
            try_files /api/token.js =404;
        }

        # =========================
        # API - JSON FILES
        # =========================
        location ~ ^/api/(.+\.json)$ {
            default_type application/json;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
            try_files $uri =404;
        }

        # =========================
        # API - OTHER FILES
        # Matches:
        # /api/*
        # =========================
        location /api/ {
            default_type application/json;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;

            try_files $uri $uri.json =404;
        }

        # =========================
        # AUTH
        # =========================
        location = /auth/login {
            try_files /auth/login.html =404;
        }

        location = /auth/signup {
            try_files /auth/signup.html =404;
        }

        location /auth/ {
            try_files $uri $uri.html /index.html;
        }

        # =========================
        # LIVE
        # =========================
        location /live/ {
            try_files $uri /live.html;
        }

        # =========================
        # LIVE 24/7
        # =========================
        location /live-24-7/ {
            try_files $uri /live-24-7.html;
        }

        # =========================
        # VIP
        # =========================
        location = /vip {
            try_files /vip.html /index.html;
        }

        # =========================
        # 24/7
        # =========================
        location = /24-7 {
            try_files /24-7.html /index.html;
        }

        # =========================
        # DASHBOARD
        # =========================
        location = /dashboard {
            try_files /dashboard.html /index.html;
        }

        # =========================
        # ROOT / HTML
        # =========================
        location / {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";

            try_files $uri $uri.html /index.html;
        }

        # =========================
        # FALLBACK
        # =========================
        error_page 404 /index.html;
    }
}
